[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pith-pdf"
version = "0.1.0"
description = "PDF text extraction SDK: classic xref, xref streams, cmap and CID fonts via the pith-pdf Rust cdylib (ctypes, zero-dep)"
license = "MIT"
requires-python = ">=3.9"
keywords = ["pdf", "text-extraction", "cmap", "fonts", "hashing"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Rust",
  "Topic :: Text Processing :: General",
]

[project.urls]
Repository = "https://github.com/pith-hash/pith-pdf"
Homepage = "https://github.com/pith-hash/pith-pdf"

[tool.setuptools]
packages = ["pith_pdf"]

[tool.setuptools.package-data]
pith_pdf = ["*.dll", "*.dylib", "*.so"]
